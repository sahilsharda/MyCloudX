<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MyCloudX — Your Personal Cloud</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/style.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
</head>
<body>
  <header>
    <div class="logo">☁️ MyCloudX</div>
    <div class="actions">
      <button onclick="showQRModal()" class="icon-btn"><span class="material-icons-round">qr_code</span></button>
      <button onclick="refresh()" class="icon-btn"><span class="material-icons-round">refresh</span></button>
      <button onclick="toggleAuth()" class="icon-btn"><span class="material-icons-round">lock</span></button>
    </div>
  </header>

  <main>
    <div id="authPanel" class="auth-card">
      <input id="token" type="password" placeholder="Enter token (default: secret123)">
      <button onclick="login()">Login</button>
      <p id="authStatus"></p>
    </div>

    <div id="gallery" class="gallery-grid"></div>
  </main>

  <label class="fab">
    <input id="file" type="file" onchange="upload()">
    <span class="material-icons-round">add</span>
  </label>

  <div id="qrModal" onclick="handleModalClick(event)">
    <div id="qrBox">
      <h2>📱 Connect Device</h2>
      <iframe src="/qr" width="270" height="340"></iframe>
      <br><button onclick="hideQRModal()">Close</button>
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
